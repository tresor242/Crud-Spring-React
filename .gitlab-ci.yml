stages:
  - test
  - build
  - push
  - deploy

variables:
  BACKEND_IMAGE: "tresor242/backendcrudspringbootreact"
  FRONTEND_IMAGE: "tresor242/frontendcrudspringbootreact"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
  PATH: "$JAVA_HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

test_backend:
  stage: test
  tags:
    - shell
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw test

build_frontend_assets:
  stage: build
  tags:
    - shell
  script:
    - cd frontend
    - npm ci
    - npm run build

build_backend_image:
  stage: build
  tags:
    - shell
  script:
    - docker build -t $BACKEND_IMAGE:latest -f backend/Dockerfile backend

build_frontend_image:
  stage: build
  tags:
    - shell
  script:
    - docker build -t $FRONTEND_IMAGE:latest -f frontend/Dockerfile frontend

push_images:
  stage: push
  tags:
    - shell
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker push $BACKEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main

deploy_app:
  stage: deploy
  tags:
    - shell
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $APP_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $APP_SERVER_USER@$APP_SERVER_HOST "cd $APP_DEPLOY_PATH && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"
  only:
    - main